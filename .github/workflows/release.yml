name: Release pack

# Publishing a new version:
#   1. bump package_version in manifest.json
#   2. git tag v<version> && git push --tags
# This builds the zip, writes the matching sha256 into versions.json on main, and
# attaches the zip to a GitHub release. PopTracker's updater reads versions.json
# from main via the manifest's versions_url, so both must land together.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check the tag matches manifest.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          manifest_version=$(python3 -c "import json;print(json.load(open('manifest.json'))['package_version'])")
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$manifest_version" != "$tag_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match manifest package_version $manifest_version"
            exit 1
          fi
          echo "version=$manifest_version" >> "$GITHUB_ENV"

      - name: Build pack and update versions.json
        run: |
          python3 tools/build_pack.py --changelog "See the release notes for ${GITHUB_REF_NAME}"
          python3 -c "import json;json.load(open('versions.json'));print('versions.json is valid')"

      - name: Commit versions.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- versions.json; then
            git add versions.json
            git commit -m "Update versions.json for ${GITHUB_REF_NAME}"
            git push origin HEAD:main
          else
            echo "versions.json already up to date"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
